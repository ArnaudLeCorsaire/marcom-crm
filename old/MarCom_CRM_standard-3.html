function statsData(){
  const evs=TOPS.filter(s=>yearOk(s.e)).slice().sort((a,b)=>(b.e.date||'').localeCompare(a.e.date||''));
  const R2=EVSTATS.filter(s=>yearOk(s.e)).flatMap(s=>s.regs);
  const R=evs.flatMap(s=>s.regs), cnt=(l,f)=>l.filter(f).length, P=x=>x.cat==='present', A=x=>x.cat==='absent';
  const rate=(a,b)=>b?Math.round(a/b*100)+' %':'—', bar=(a,b)=>b?`<span class="stx-bar" style="width:${Math.max(2,Math.round(a/b*60))}px"></span>`:'';
  const k=l=>({inv:l.length,pres:cnt(l,P),regd:cnt(l,x=>x.cat==='registered'),ref:cnt(l,x=>x.sub==='refus'),noresp:cnt(l,x=>x.sub==='noresp'),noshow:cnt(l,x=>A(x)&&x.sub==='noshow')});
  const T=k(R), answered=T.inv-T.noresp, yes=T.pres+T.regd+T.noshow;
  // première présence de chaque personne (sur toutes les données)
  const first={}; TOPS.slice().sort((a,b)=>(a.e.date||'').localeCompare(b.e.date||'')).forEach(s=>s.regs.forEach(r=>{if(r.present&&!first[r.p.id])first[r.p.id]=s.e.id}));
  const secs=[];
  // par année
  const yrs={}; evs.forEach(s=>{const y=yearOf(s.e);(yrs[y]=yrs[y]||[]).push(s)});
  secs.push({id:'year',title:t('sxYear'),sub:t('sxYearSub'),head:[t('cYear'),t('cEvents'),t('cInv'),t('cPres'),t('cRate'),t('cUniq'),t('cNew')],num:[1,2,3,4,5,6],
    rows:Object.keys(yrs).sort().reverse().map(y=>{const l=yrs[y].flatMap(s=>s.regs),kk=k(l);return{cells:[y==='none'?t('noDateL'):y,yrs[y].length,kk.inv,kk.pres,rate(kk.pres,kk.inv),new Set(l.filter(P).map(r=>r.p.id)).size,yrs[y].reduce((a,s)=>a+s.regs.filter(r=>r.present&&first[r.p.id]===s.e.id).length,0)],bar:[kk.pres,kk.inv,4]}})});
  // par événement
  secs.push({id:'ev',title:t('sxEvTab'),sub:t('sxEvSub'),head:[t('cDate'),t('cEvent'),t('cPlace'),t('cInv'),t('cAns'),t('cYes'),t('cPres'),t('cRef'),t('cNoResp'),t('cNoShow'),t('cRate'),t('cNew')],num:[3,4,5,6,7,8,9,10,11],
    rows:evs.flatMap(s=>{const row=(x,ch)=>{const kk=k(x.regs);return{open:['event',x.e.id],sub:ch,dot:evDot(x.e,ch),cells:[numWhen(x.e),ch?subLabel(x.e):evName(x.e),place(x.e.lieu)||'',kk.inv,kk.inv-kk.noresp,kk.pres+kk.regd+kk.noshow,kk.pres,kk.ref,kk.noresp,kk.noshow,rate(kk.pres,kk.inv),ch?'':x.regs.filter(r=>r.present&&first[r.p.id]===x.e.id).length],bar:[kk.pres,kk.inv,10]}};
      return [row(s,false),...(s.isGroup?s.children.map(c=>row(c,true)):[])]})});
  // entreprises
  const co={}; R.forEach(r=>{if(!r.p.coId)return;const o=co[r.p.coId]=co[r.p.coId]||{c:CMAP[r.p.coId],ppl:new Set(),l:[]};o.ppl.add(r.p.id);o.l.push(r)});
  secs.push({id:'co',title:t('sxCo'),head:[t('cCo'),t('cContacts'),t('cInv'),t('cPres'),t('cRate'),t('cLast')],num:[1,2,3,4],
    rows:Object.values(co).filter(o=>o.c).map(o=>{const kk=k(o.l),lp=o.l.filter(P).sort((a,b)=>(b.ev.date||'').localeCompare(a.ev.date||''))[0];return{open:['company',o.c.id],sortv:kk.pres*1000+kk.inv,cells:[o.c.name,o.ppl.size,kk.inv,kk.pres,rate(kk.pres,kk.inv),lp?numWhen(lp.ev)+' · '+evName(lp.ev):'—'],bar:[kk.pres,kk.inv,4]}}).sort((a,b)=>b.sortv-a.sortv).slice(0,25)});
  // participants
  const pp={}; R.forEach(r=>{(pp[r.p.id]=pp[r.p.id]||{p:r.p,l:[]}).l.push(r)});
  secs.push({id:'people',title:t('sxPeople'),head:[t('cName'),t('cCo'),t('cInv'),t('cPres'),t('cRate'),t('cLast')],num:[2,3,4],
    rows:Object.values(pp).map(o=>{const kk=k(o.l),lp=o.l.filter(P).sort((a,b)=>(b.ev.date||'').localeCompare(a.ev.date||''))[0];return{open:['person',o.p.id],sortv:kk.pres*1000-kk.inv,cells:[o.p.full,o.p.societe||'',kk.inv,kk.pres,rate(kk.pres,kk.inv),lp?numWhen(lp.ev)+' · '+evName(lp.ev):'—'],bar:[kk.pres,kk.inv,4]}}).filter(r=>r.cells[3]>0).sort((a,b)=>b.sortv-a.sortv).slice(0,25)});
  // fidélité
  const per=Object.values(pp).map(o=>o.l.filter(P).length), bucket=n=>n>=5?'5+':String(n), bk={};per.forEach(n=>{const b=bucket(n);bk[b]=(bk[b]||0)+1});
  secs.push({id:'loyal',title:t('sxLoyal'),sub:t('sxLoyalSub'),head:[t('cPres'),t('cPeople'),t('cShare')],num:[1,2],
    rows:['0','1','2','3','4','5+'].filter(b=>bk[b]).map(b=>({cells:[b==='0'?t('sxNever'):b,bk[b],rate(bk[b],per.length)],bar:[bk[b],per.length,1]}))});
  // CMO
  if(CMOS.length){const cm={};R2.forEach(r=>(r.cmoKeys||[]).forEach(kx=>{const c=CMOMAP['cmo:'+kx];if(!c)return;const o=cm[c.id]=cm[c.id]||{c,ppl:new Set(),l:[]};o.ppl.add(r.p.id);o.l.push(r)}));
    secs.push({id:'cmo',title:t('sxCmo'),head:[t('cCmo'),t('cEntity'),t('cClients'),t('cInv'),t('cPres'),t('cRate')],num:[2,3,4,5],
      rows:Object.values(cm).map(o=>{const kk=k(o.l);return{open:['cmo',o.c.id],sortv:kk.pres,cells:[o.c.name,[o.c.team,o.c.region].filter(Boolean).join(' · '),o.ppl.size,kk.inv,kk.pres,rate(kk.pres,kk.inv)],bar:[kk.pres,kk.inv,5]}}).sort((a,b)=>b.sortv-a.sortv)});}
  // statuts
  const sts={};R.forEach(r=>{const l=r.st||(r.present?t('present'):t('absent'));const o=sts[l]=sts[l]||{n:0,col:r.col,cat:r.cat,sub:r.sub};o.n++});
  secs.push({id:'status',title:t('sxStatus'),head:[t('cStatus'),t('cCount'),t('cShare')],num:[1,2],
    rows:Object.entries(sts).sort((a,b)=>b[1].n-a[1].n).map(([l,o])=>({cells:[l,o.n,rate(o.n,R.length)],chip:o,bar:[o.n,R.length,1]}))});
  // champs personnalisés (par événement puis par client)
  const evKeys=[...new Set(R2.flatMap(r=>Object.keys(r.ext||{})))], cliKeys=[...new Set(R.flatMap(r=>Object.keys(r.p.ext||{})))].filter(x=>!/^fichiers? sources?$|^source files?$/i.test(x));
  [...evKeys.map(x=>[x,'ev']),...cliKeys.map(x=>[x,'cli'])].forEach(([key,kind])=>{
    const g={};(kind==='ev'?R2:R).forEach(r=>{const v=(kind==='ev'?(r.ext||{})[key]:(r.p.ext||{})[key])||'—';(g[v]=g[v]||[]).push(r)});
    if(Object.keys(g).length>60)return;
    secs.push({id:'f:'+key,title:t('sxField')(key),sub:t('sxFieldSub'),head:[t('cValue'),t('cPeople'),t('cInv'),t('cPres'),t('cRate')],num:[1,2,3,4],
      rows:Object.entries(g).map(([v,l])=>{const kk=k(l);return{sortv:kk.inv,cells:[v,new Set(l.map(r=>r.p.id)).size,kk.inv,kk.pres,rate(kk.pres,kk.inv)],bar:[kk.pres,kk.inv,4]}}).sort((a,b)=>b.sortv-a.sortv)});
  });
  return{evs,T,answered,yes,uniqInv:new Set(R.map(r=>r.p.id)).size,uniqPres:new Set(R.filter(P).map(r=>r.p.id)).size,secs,rate,bar};
}
/* ---------- Graphiques SVG autonomes (exportables en image) ---------- */
const CH={pres:'#00915A',regd:'#2a78d6',noshow:'#e34948',ref:'#eda100',noresp:'#A9B3AE',inv:'#2a78d6',grid:'#E3E9E6',ink:'#14231C',muted:'#5E6E67',track:'#E6EEF8'};
const CH_FONT="Segoe UI, Arial, Helvetica, sans-serif";
const chTxt=(x,y,txt,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||12}" fill="${o.c||CH.muted}"${o.w?` font-weight="${o.w}"`:''}${o.a?` text-anchor="${o.a}"`:''}>${esc(txt)}</text>`;
const chTrunc=(v,n)=>{v=String(v);return v.length>n?v.slice(0,n-1)+'…':v};
const chW=v=>String(v).length*6.6;
const fmtN=n=>Number(n).toLocaleString(lang==='fr'?'fr-BE':'en-GB');
function chWrap(w,title,sub,legend,bodyH,body){
  let lx=0;const lg=(legend||[]).map(([c,l])=>{const x=lx;lx+=26+chW(l);return `<rect x="${x}" y="-9" width="11" height="11" rx="3" fill="${c}"/>${chTxt(x+16,0,l,{s:12,c:CH.ink})}`}).join('');
  const top=sub?54:36, ly=top+(legend&&legend.length?8:0), by=ly+(legend&&legend.length?18:0), H=by+bodyH+8;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" font-family="${CH_FONT}" role="img" aria-label="${esc(title)}"><rect width="${w}" height="${H}" fill="#ffffff"/>
    ${chTxt(0,20,title,{s:16,w:700,c:CH.ink})}${sub?chTxt(0,40,sub,{s:12}):''}${lg?`<g transform="translate(0,${ly+4})">${lg}</g>`:''}<g transform="translate(0,${by})">${body}</g></svg>`;
}
/* barres horizontales empilées : rows=[{label,parts:[[key,val]],total,right,tip}] */
function chStack(title,sub,rows,keys){
  const W=820,LW=300,RW=170,BW=W-LW-RW,RH=30,max=Math.max(1,...rows.map(r=>r.total));
  const body=rows.map((r,i)=>{const y=i*RH;let x=LW;const segs=r.parts.filter(([,v])=>v>0).map(([k,v],j,arr)=>{const w=v/max*BW,last=j===arr.length-1;const g=last?0:2;const el=`<rect x="${x.toFixed(1)}" y="${y+6}" width="${Math.max(1,w-g).toFixed(1)}" height="18" fill="${CH[k]}" data-tip="1"><title>${esc(r.label)} — ${esc(keys[k])} : ${v}</title></rect>`;x+=w;return el}).join('');
    return `${chTxt(LW-10,y+19,chTrunc(r.label,44),{a:'end',c:CH.ink})}<g clip-path="url(#cs${i})"><clipPath id="cs${i}"><rect x="${LW}" y="${y+6}" width="${(r.total/max*BW).toFixed(1)}" height="18" rx="4"/></clipPath>${segs}</g>${chTxt(LW+r.total/max*BW+8,y+19,r.right,{c:CH.ink})}`}).join('');
  return chWrap(W,title,sub,Object.keys(keys).map(k=>[CH[k],keys[k]]),rows.length*RH,`<line x1="${LW}" y1="0" x2="${LW}" y2="${rows.length*RH}" stroke="${CH.grid}"/>`+body);
}
/* barres horizontales : présents (plein) sur invités (piste) */
function chTrack(title,sub,rows,W=760){
  const LW=W<600?160:230,RW=W<600?110:150,BW=W-LW-RW,RH=28,max=Math.max(1,...rows.map(r=>r.inv));
  const body=rows.map((r,i)=>{const y=i*RH,wi=r.inv/max*BW,wp=r.pres/max*BW;
    return `${chTxt(LW-10,y+18,chTrunc(r.label,Math.floor(LW/7)),{a:'end',c:CH.ink})}<rect x="${LW}" y="${y+6}" width="${Math.max(1,wi).toFixed(1)}" height="16" rx="4" fill="${CH.track}" data-tip="1"><title>${esc(r.label)} — ${t('lgInv')} : ${r.inv}</title></rect>${wp>0?`<rect x="${LW}" y="${y+6}" width="${Math.max(2,wp).toFixed(1)}" height="16" rx="4" fill="${CH.pres}" data-tip="1"><title>${esc(r.label)} — ${t('lgPres')} : ${r.pres} / ${r.inv}</title></rect>`:''}
      ${chTxt(LW+wi+8,y+18,`${r.pres} / ${r.inv} · ${r.inv?Math.round(r.pres/r.inv*100):0} %`,{c:CH.ink})}`}).join('');
  return chWrap(W,title,sub,[[CH.pres,t('lgPres')],[CH.track,t('lgInv')]],rows.length*RH,body);
}
/* colonnes groupées (années) */
function chColumns(title,sub,cats,series,W=760){
  const H=W<600?170:220,LM=44,BW=W-LM-10,max=Math.max(1,...series.flatMap(s=>s.vals)),nice=(m=>{const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p})(max);
  const ticks=[0,.25,.5,.75,1].map(f=>f*nice),gw=BW/cats.length,cw=Math.min(24,(gw-20)/series.length);
  const grid=ticks.map(v=>{const y=H-v/nice*H;return `<line x1="${LM}" x2="${W}" y1="${y}" y2="${y}" stroke="${CH.grid}"/>${chTxt(LM-6,y+4,fmtN(Math.round(v)),{a:'end',s:11})}`}).join('');
  const cols=cats.map((c,i)=>{const gx=LM+i*gw+gw/2-(cw*series.length+4*(series.length-1))/2;
    return series.map((s,j)=>{const v=s.vals[i],h=v/nice*H,x=gx+j*(cw+4),y=H-h;return `<path d="M${x},${H} V${y+Math.min(4,h)} q0,-4 4,-4 h${cw-8} q4,0 4,4 V${H} Z" fill="${s.c}" data-tip="1"><title>${esc(c.label)} — ${esc(s.name)} : ${v}</title></path>${chTxt(x+cw/2,y-5,fmtN(v),{a:'middle',s:11,c:CH.ink})}`}).join('')
      +chTxt(LM+i*gw+gw/2,H+18,c.label,{a:'middle',c:CH.ink,w:600})+(c.note?chTxt(LM+i*gw+gw/2,H+34,c.note,{a:'middle',s:11}):'')}).join('');
  return chWrap(W,title,sub,series.map(s=>[s.c,s.name]),H+40,`<g transform="translate(0,14)">${grid}${cols}</g>`);
}
/* anneau (statuts) */
function chDonut(title,sub,items){
  const W=760,R=90,r=56,cx=110,cy=100,tot=items.reduce((a,b)=>a+b.n,0)||1;let a0=-Math.PI/2;
  const arcs=items.map(it=>{const a1=a0+it.n/tot*Math.PI*2,large=a1-a0>Math.PI?1:0,p=(a,rad)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];

const CHUNK=120;let MORE=null,moreObs=null;
function pagedL(list,fn){
  MORE=list.length>CHUNK?{list,fn,pos:CHUNK}:null;
  let h='';for(let i=0;i<Math.min(CHUNK,list.length);i++)h+=fn(list[i],i);
  return h+(MORE?'<div class="more-sent" aria-hidden="true"></div>':'');
}
function moreStep(){
  const M=MORE,sn=grid.querySelector('.more-sent');if(!M||!sn)return;
  const end=Math.min(M.pos+240,M.list.length);let h='';for(let i=M.pos;i<end;i++)h+=M.fn(M.list[i],i);
  sn.insertAdjacentHTML('beforebegin',h);M.pos=end;
  if(end>=M.list.length){MORE=null;if(moreObs)moreObs.disconnect();sn.remove();return}
  requestAnimationFrame(()=>{if(MORE===M&&sn.isConnected&&sn.getBoundingClientRect().top<innerHeight+1200)moreStep()});
}
function armMore(){
  if(moreObs){moreObs.disconnect();moreObs=null}
  const sn=MORE&&grid.querySelector('.more-sent');if(!sn){MORE=null;return}
  moreObs=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))moreStep()},{rootMargin:'1200px 0px'});
  moreObs.observe(sn);
}

/* Prénom / nom d'un CMO : saisis à la main, sinon ceux de sa fiche personne, sinon déduits du nom affiché
   (« PEETERS Sarah » → Sarah / PEETERS ; « Sarah Peeters » → Sarah / Peeters) */
function splitFullName(n){
  const tk=String(n||'').trim().split(/\s+/).filter(Boolean);if(tk.length<2)return{prenom:'',nom:tk[0]||''};
  const caps=w=>w.length>1&&w===w.toUpperCase()&&/\p{L}/u.test(w);
  if(caps(tk[0])&&!caps(tk[tk.length-1])){let i=0;while(i<tk.length-1&&caps(tk[i]))i++;return{nom:tk.slice(0,i).join(' '),prenom:tk.slice(i).join(' ')}}
  if(caps(tk[tk.length-1])&&!caps(tk[0])){let i=tk.length;while(i>1&&caps(tk[i-1]))i--;return{prenom:tk.slice(0,i).join(' '),nom:tk.slice(i).join(' ')}}
  return{prenom:tk[0],nom:tk.slice(1).join(' ')};
}
function cmoNames(o){
  const m=o.meta||{};
  if(m.prenom!=null||m.nom!=null)return{prenom:m.prenom||'',nom:m.nom||''};
  if(o.person&&normName(o.person.full)===normName(o.name))return{prenom:o.person.prenom||'',nom:o.person.nom||''};
  return splitFullName(o.name);
}

  if(type==='cmo'){const n=cmoNames(o);return{prenom:n.prenom,nom:n.nom,email:o.email,phone:o.phone,region:o.meta.region||'',team:o.team}}
  if(type==='company')return{name:o.name,rmpm:(CMETA[o.id]||{}).rmpm||o.rmpm||'',sector:(CMETA[o.id]||{}).sector||'',website:o.website,address:o.address,desc:o.desc};
  const e=o.e,pm=(EVMETA[e.id]||{}).parent;return{name:e.name,date:e.date,lieu:e.lieu,type:e.type,desc:e.desc,parent:pm==='-'?'':(e.gid&&GROUPMAP[e.gid]?GROUPMAP[e.gid].keyName:'')};
}

/* ---------- Recadrage d'image : glisser pour positionner, curseur ou molette pour zoomer ---------- */
let cropState=null,formPhotoHandler=null;
function openCrop(file,[W,H],round){
  return new Promise(resolve=>{
    if(cropState)cropFinish(null);
    const img=$('cropImg');let url='';
    img.onload=()=>{
      $('cropTitle').textContent=t('cropTitle');$('cropHint').textContent=t('cropHint');$('cropOk').textContent=t('cropOk');$('cropCancel').textContent=t('cancel');
      const maxW=Math.min(560,window.innerWidth-90),maxH=Math.max(200,Math.min(420,window.innerHeight-320));
      let Fw=maxW,Fh=Fw*H/W; if(Fh>maxH){Fh=maxH;Fw=Fh*W/H}
      Fw=Math.round(Fw);Fh=Math.round(Fh);
      const fr=$('cropFrame');fr.style.width=Fw+'px';fr.style.height=Fh+'px';fr.classList.toggle('round',!!round);
      const iw=img.naturalWidth,ih=img.naturalHeight,sMin=Math.min(Fw/iw,Fh/ih),s0=Math.max(Fw/iw,Fh/ih),sMax=s0*6;
      cropState={W,H,Fw,Fh,iw,ih,sMin,sMax,s:s0,x:(Fw-iw*s0)/2,y:(Fh-ih*s0)/2,url,resolve};
      cropDraw();$('cropModal').hidden=false;
    };
    img.onerror=()=>{toast(t('photoErr'),true);resolve(null)};
    const rd=new FileReader();rd.onload=()=>{url=rd.result;img.src=url};rd.onerror=()=>{toast(t('photoErr'),true);resolve(null)};rd.readAsDataURL(file);
  });
}
function cropDraw(){
  const c=cropState;if(!c)return;
  const w=c.iw*c.s,h=c.ih*c.s;
  c.x=w>=c.Fw?Math.min(0,Math.max(c.Fw-w,c.x)):(c.Fw-w)/2;
  c.y=h>=c.Fh?Math.min(0,Math.max(c.Fh-h,c.y)):(c.Fh-h)/2;
  const img=$('cropImg');img.style.width=c.iw+'px';img.style.height=c.ih+'px';img.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.s})`;
  $('cropZoom').value=Math.round(1000*Math.log(c.s/c.sMin)/Math.log(c.sMax/c.sMin));
}
function cropZoomTo(ns,px,py){
  const c=cropState;if(!c)return;
  ns=Math.min(c.sMax,Math.max(c.sMin,ns));
  c.x=px-(px-c.x)*ns/c.s; c.y=py-(py-c.y)*ns/c.s; c.s=ns; cropDraw();
}
function cropFinish(blob){
  const c=cropState;if(!c)return;
  cropState=null;$('cropModal').hidden=true;c.resolve(blob);
}
(()=>{
  const fr=$('cropFrame');let drag=null;
  fr.addEventListener('pointerdown',e=>{if(!cropState)return;drag={x:e.clientX,y:e.clientY};try{fr.setPointerCapture(e.pointerId)}catch(_){}});
  fr.addEventListener('pointermove',e=>{if(!drag||!cropState)return;cropState.x+=e.clientX-drag.x;cropState.y+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};cropDraw()});
  fr.addEventListener('pointerup',()=>drag=null);fr.addEventListener('pointercancel',()=>drag=null);
  fr.addEventListener('wheel',e=>{if(!cropState)return;e.preventDefault();const r=fr.getBoundingClientRect();cropZoomTo(cropState.s*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  $('cropZoom').addEventListener('input',e=>{const c=cropState;if(!c)return;cropZoomTo(c.sMin*Math.pow(c.sMax/c.sMin,e.target.value/1000),c.Fw/2,c.Fh/2)});
  $('cropOk').onclick=()=>{
    const c=cropState;if(!c)return;
    const cv=document.createElement('canvas');cv.width=c.W;cv.height=c.H;
    const ctx=cv.getContext('2d'),k=c.W/c.Fw;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.W,c.H);ctx.imageSmoothingQuality='high';
    ctx.drawImage($('cropImg'),c.x*k,c.y*k,c.iw*c.s*k,c.ih*c.s*k);
    cv.toBlob(b=>cropFinish(b||null),'image/jpeg',0.88);
  };
  $('cropCancel').onclick=$('cropClose').onclick=()=>cropFinish(null);
  $('cropModal').addEventListener('mousedown',e=>{if(e.target===$('cropModal'))cropFinish(null)});
})();

async function photoDrop(target,file){

    for(const k in vals){if(typeof vals[k]==='boolean'){if(vals[k]!==!!cur[k])ch[k]=vals[k]}else if(vals[k]!==(cur[k]||''))ch[k]=vals[k]}

      }

        Object.entries(xNew).forEach(([k,v])=>{if(base[k]!==v)ex[k]=v});Object.keys(base).forEach(k=>{if(!(k in xNew))ex[k]=''});pm.extra=ex}
      PMETA[o.id]=pm;
    }else if(type==='company'){CMETA[o.id]={...(CMETA[o.id]||{}),...ch,...(xChanged?{extra:xNew}:{})}}
    else if(type==='cmo'){if(ch.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ch.email)){$('fErr').textContent=t('badEmail');$('fSave').disabled=false;return}if('prenom' in ch||'nom' in ch){ch.prenom=vals.prenom;ch.nom=vals.nom;ch.name=(vals.prenom+' '+vals.nom).trim()}CMOMETA[o.key]={...(CMOMETA[o.key]||{}),...ch,...(xChanged?{extra:xNew}:{})}}
    else{if('parent' in ch)ch.parent=ch.parent||'-';const m={...(EVMETA[o.e.id]||{}),...ch,...(xChanged?{extra:xNew}:{})};if(m.name===o.e.raw)m.name='';EVMETA[o.e.id]=m}

function parseCSV(text){

    else if(c==='"')q=true;

async function readZip(buf){

  for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('zip');
  const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<cnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[td.decode(u.subarray(p+46,p+46+nl))]={method,csize,off};p+=46+nl+xl+cl;
  }
  return{async text(name){
    const f=files[name];if(!f)return null;
    const st=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u.slice(st,st+f.csize);
    let out;
    if(f.method===0)out=data;
    else if(f.method===8)out=new Uint8Array(await new Response(new Response(data).body.pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else throw new Error('method');
    return td.decode(out);
  }};
}

/* --- opérations : ce qu'un utilisateur a complété, champ par champ --- */
function shOk(o){
  if(!o||typeof o.k!=='string'||!o.k||o.k.length>500)return false;
  if(SH_STORES[o.s])return!!o.f&&typeof o.f==='object'&&!Array.isArray(o.f)&&Object.keys(o.f).every(f=>!SH_DENY[o.s].includes(f)&&f.length<80);
  if(o.s==='note')return!o.k.startsWith('ev:')&&typeof o.id==='string'&&(o.v===null||(!!o.v&&typeof o.v.text==='string'&&o.v.id===o.id&&o.v.text.length<20000));
  if(o.s==='man')return o.v===null||(!!o.v&&typeof o.v==='object'&&o.v.mid===o.k&&!o.v.event&&!o.v.evOnly&&!o.v.evId);
  if(o.s==='photo')return o.v===null||(typeof o.v==='string'&&o.v.length<4e6&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(o.v));
  if(o.s==='report')return!!o.v&&typeof o.v==='object'&&typeof o.v.msg==='string';
  return false;
}
function shApply(o){ // renvoie la valeur précédente, ou undefined si l'opération est refusée
  if(!shOk(o))return undefined;
  if(SH_STORES[o.s]){const S=SH_STORES[o.s](),cur={...(S[o.k]||{})},prev={};
    for(const[f,v]of Object.entries(o.f)){prev[f]=f in cur?cur[f]:null;if(v===null)delete cur[f];else cur[f]=v}
    if(Object.keys(cur).length)S[o.k]=cur;else delete S[o.k];return prev}
  if(o.s==='note'){const l=NOTES[o.k]||[],old=l.find(n=>n.id===o.id)||null,nl=l.filter(n=>n.id!==o.id);if(o.v)nl.push(o.v);if(nl.length)NOTES[o.k]=nl;else delete NOTES[o.k];return old}
  if(o.s==='man'){const old=MANROWS.find(r=>r.mid===o.k)||null;if(old&&(old.event||old.evOnly||old.evId))return undefined;MANROWS=MANROWS.filter(r=>r.mid!==o.k);if(o.v)MANROWS.push(o.v);return old}
  if(o.s==='photo'){if(EMAP[o.k])return undefined;const old=PHOTOS[o.k]||null;if(o.v)PHOTOS[o.k]=o.v;else delete PHOTOS[o.k];return old}
  return null; // signalement : rien à appliquer
}
function shSnap(){
  const o={};for(const s in SH_STORES){const S=SH_STORES[s](),m={};for(const k in S)m[k]=JSON.stringify(S[k]);o[s]=m}
  o.note={};for(const k in NOTES)(NOTES[k]||[]).forEach(x=>{if(x&&x.id)o.note[k+'\u0001'+x.id]=JSON.stringify(x)});
  o.man={};MANROWS.forEach(r=>{if(r.mid)o.man[r.mid]=JSON.stringify(r)});o.photo={...PHOTOS};return o;
}
function shDiff(){
  const A=SHADOW,B=shSnap(),ops=[],inv=[];SHADOW=B;if(!A)return{ops,inv};
  for(const s in SH_STORES){const a=A[s],b=B[s];for(const k of new Set([...Object.keys(a),...Object.keys(b)])){if(a[k]===b[k])continue;
    const x=a[k]?JSON.parse(a[k]):{},y=b[k]?JSON.parse(b[k]):{},f={},g={};
    for(const z of new Set([...Object.keys(x),...Object.keys(y)]))if(JSON.stringify(x[z])!==JSON.stringify(y[z])){f[z]=z in y?y[z]:null;g[z]=z in x?x[z]:null}
    if(Object.keys(f).length){ops.push({s,k,f});inv.push({s,k,f:g})}}}
  for(const key of new Set([...Object.keys(A.note),...Object.keys(B.note)])){if(A.note[key]===B.note[key])continue;const i=key.indexOf('\u0001'),k=key.slice(0,i),id=key.slice(i+1);
    ops.push({s:'note',k,id,v:B.note[key]?JSON.parse(B.note[key]):null});inv.push({s:'note',k,id,v:A.note[key]?JSON.parse(A.note[key]):null})}
  for(const k of new Set([...Object.keys(A.man),...Object.keys(B.man)])){if(A.man[k]===B.man[k])continue;ops.push({s:'man',k,v:B.man[k]?JSON.parse(B.man[k]):null});inv.push({s:'man',k,v:A.man[k]?JSON.parse(A.man[k]):null})}
  for(const k of new Set([...Object.keys(A.photo),...Object.keys(B.photo)])){if(A.photo[k]===B.photo[k])continue;ops.push({s:'photo',k,v:B.photo[k]||null});inv.push({s:'photo',k,v:A.photo[k]||null})}

}
function shQueue(ops){

async function shFlush(){

    const e=await encK(shBytes({uid:SHCFG.user.id,name:SHCFG.user.name,ops:SHCFG.mine||[]}),SHARE.key);
    await shWrite(cd,SHCFG.user.id+'.mcj',JSON.stringify({format:'marcom-contrib',v:1,...e}));SHCFG.dirty=false;saveVault(true)}

async function shSync(force){

    if(!SHARE.key)SHARE.key=await shTeamKey(SHARE.dir,SHCFG.pass);

      if(!force&&SHARE.mod[mk]===f.lastModified)continue;SHARE.mod[mk]=f.lastModified;

async function shRecompute(){

  Object.values(SHARE.files).forEach(b=>{if(b.uid===me)return;b.ops.forEach(o=>{if(o&&o.q>(cons[b.uid]||0))all.set(b.uid+'#'+o.q,{...o,uid:b.uid,by:b.name})})});

  PROV={};[...all.values()].sort((a,b)=>String(a.at).localeCompare(String(b.at))||String(a.uid).localeCompare(String(b.uid))||a.q-b.q)

const GF_PHONE=/^\+?[0-9][0-9 ().\/-]{5,22}$/,GF_LI=/^(https?:\/\/)?([a-z]{2,3}\.)?linkedin\.com\/(in|company|pub|profile)\/\S+$/i,GF_WEB=/^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?(\/\S*)?$/i;

function gfCheck(type,v,o){
  if(ADMIN)return'';
  const cur=o?formVals(type,o):{},ch=k=>v[k]!=null&&v[k]!==''&&v[k]!==(cur[k]||'');
  if(ch('email')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))return t('badEmail');
  if(ch('phone')&&!GF_PHONE.test(v.phone))return t('gfPhone');
  if(ch('linkedin')&&!GF_LI.test(v.linkedin))return t('gfLinkedin');
  if(ch('website')&&!GF_WEB.test(v.website))return t('gfWeb');
  if(type==='person'&&ch('societe')&&!COMPANIES.some(c=>normName(c.name)===normName(v.societe)))return t('gfCo');
  if(type==='company'&&ch('sector')&&!gfSectors().some(s=>normName(s)===normName(v.sector)))return t('gfSector');

  for(const k of['prenom','nom','poste','name','address','region','team','societe'])if(ch(k)&&v[k].length>120)return t('gfLong');
  if(ch('desc')&&v.desc.length>2000)return t('gfLong');

}

/* Dates d'un événement, complètes et courtes : « 15–17 sept. 26 », « 30 sept. – 2 oct. 26 » */
function evRangeShort(e){
  if(!e.date)return'';const a=dayMonth(e.date),y=String(a.y).slice(2);
  if(!e.end||e.end<=e.date)return`${a.d} ${a.m} ${y}`;
  const b=dayMonth(e.end);
  if(e.end.slice(0,7)===e.date.slice(0,7))return`${a.d}–${b.d} ${a.m} ${y}`;
  if(e.end.slice(0,4)===e.date.slice(0,4))return`${a.d} ${a.m} – ${b.d} ${b.m} ${y}`;
  return`${a.d} ${a.m} ${y} – ${b.d} ${b.m} ${String(b.y).slice(2)}`;
}

/* ---------- graphiques supplémentaires ---------- */
function chLine(title,sub,cats,series,W=820){
  const H=200,LM=44,PW=W-LM-16,max=Math.max(1,...series.flatMap(s=>s.vals)),nice=(m=>{const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p})(max);
  const X=i=>LM+(cats.length<2?PW/2:i*PW/(cats.length-1)),Y=v=>H-v/nice*H,step=Math.max(1,Math.ceil(cats.length/12));
  const grid=[0,.25,.5,.75,1].map(f=>{const v=f*nice,y=Y(v);return`<line x1="${LM}" x2="${W}" y1="${y}" y2="${y}" stroke="${CH.grid}"/>${chTxt(LM-6,y+4,fmtN(Math.round(v)),{a:'end',s:11})}`}).join('');
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" points="${s.vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>${s.vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="${s.c}" data-tip="1"><title>${esc(cats[i])} — ${esc(s.name)} : ${v}</title></circle>`).join('')}`).join('');
  const xl=cats.map((c,i)=>i%step?'':chTxt(X(i),H+18,c,{a:'middle',s:11,c:CH.ink})).join('');
  return chWrap(W,title,sub,series.map(s=>[s.c,s.name]),H+26,`<g transform="translate(0,8)">${grid}${lines}${xl}</g>`);
}
/* schéma de flux (Sankey simplifié) */
function chFlow(title,sub,K){
  const W=820,H=250,NW=14,cols=[0,215,430,645],gap=16,tot=Math.max(1,K.inv);
  const other=Math.max(0,K.answered-K.yes-K.ref);
  const s=(H-gap*2)/tot,N={};
  const place=(col,list)=>{let y=0;list.forEach(([id,v,label,c])=>{if(v<=0)return;N[id]={x:cols[col],y,h:Math.max(3,v*s),v,label,c,out:0};y+=Math.max(3,v*s)+gap})};
  place(0,[['inv',K.inv,t('flInv'),'#5598e7']]);
  place(1,[['ans',K.answered,t('flAns'),'#2a78d6'],['nr',K.noresp,t('flNoresp'),CH.noresp]]);
  place(2,[['yes',K.yes,t('flYes'),'#1f8f6a'],['ref',K.ref,t('flRef'),CH.ref],['oth',other,t('flOther'),'#B9C3BE']]);
  place(3,[['pres',K.pres,t('flPres'),CH.pres],['regd',K.regd,t('flRegd'),CH.regd],['ns',K.noshow,t('flNoshow'),CH.noshow]]);
  const L=[['inv','ans'],['inv','nr'],['ans','yes'],['ans','ref'],['ans','oth'],['yes','pres'],['yes','regd'],['yes','ns']];
  const links=L.filter(([a,b])=>N[a]&&N[b]).map(([a,b])=>{const A=N[a],B=N[b],h=B.v*s,x1=A.x+NW,x2=B.x,y1=A.y+A.out,y2=B.y,m=(x1+x2)/2;A.out+=h;
    return`<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2} L${x2},${y2+h} C${m},${y2+h} ${m},${y1+h} ${x1},${y1+h} Z" fill="${B.c}" opacity=".28" data-tip="1"><title>${esc(A.label)} → ${esc(B.label)} : ${B.v}</title></path>`}).join('');
  const nodes=Object.values(N).map(n=>`<rect x="${n.x}" y="${n.y}" width="${NW}" height="${n.h.toFixed(1)}" rx="3" fill="${n.c}"/><text x="${n.x+NW+6}" y="${(n.y+Math.min(n.h/2,40)+4).toFixed(1)}" font-size="12.5" fill="${CH.ink}" stroke="#fff" stroke-width="3" paint-order="stroke"><tspan font-weight="700">${esc(n.label)}</tspan><tspan x="${n.x+NW+6}" dy="15">${fmtN(n.v)} · ${Math.round(n.v/tot*100)} %</tspan></text>`).join('');
  return chWrap(W,title,sub,null,H,links+nodes);
}

function stxScopeTxt(){const F=STX,p=[];if(F.y)p.push(F.y);if(F.type)p.push(F.type);if(F.seg)p.push(F.seg==='noref'?t('stxNoRef'):rkLabel(RK.find(x=>x[0]===F.seg)));if(F.ctry)p.push(F.ctry);if(F.ent)p.push(F.ent==='__none'?t('entNone'):F.ent);if(F.who)p.push(F.who==='ext'?t('stxWhoExt'):t('stxWhoInt'));
  return t('stxScope')+' : '+(p.length?p.join(' · '):t('stxScopeAll'))}
function stxPrev(){if(!STX.y||!/^\d{4}$/.test(STX.y))return null;const y=String(+STX.y-1);if(!yearList().includes(y))return null;return{y,K:stxKpi({...STX,y})}}
function stxKpiList(D){const K=D.K;return[[fmtN(K.evs.length),t('sxEvents')],[fmtN(K.inv),t('sxInv')],[fmtN(K.uniqInv),t('sxPeopleInv')],[fmtN(K.pres),t('sxPres')],[fmtN(K.uniqPres),t('sxUniq')],[pctS(K.pres,K.inv),t('sxRate')],[pctS(K.answered,K.inv),t('sxResp')],[pctS(K.pres,K.yes),t('sxShow')]]}
function stxMessages(D){
  const K=D.K,out=[],pv=stxPrev();
  let a=t('msgA')(K.evs.length,fmtN(K.inv),fmtN(K.pres),pctS(K.pres,K.inv));
  if(pv&&pv.K.inv){const d=pctN(K.pres,K.inv)-pctN(pv.K.pres,pv.K.inv);a+=t('msgDelta')(d,pv.y)}out.push(a);
  const up=new Set(K.R.filter(r=>r.cat==='present').map(r=>r.p.id)),nw=[...up].filter(id=>{const f=D.first[id];return f&&K.evs.some(s=>s.e===f||(s.children||[]).some(c=>c.e===f))}).length;
  if(up.size){if(STX.y)out.push(t('msgUniq')(fmtN(up.size),fmtN(nw),pctS(nw,up.size)));
    else{const c={};K.R.forEach(r=>{if(r.cat==='present')c[r.p.id]=(c[r.p.id]||0)+1});const rr=Object.values(c).filter(n=>n>=2).length;out.push(t('msgUniqAll')(fmtN(up.size),fmtN(rr),pctS(rr,up.size)))}}
  const ev=D.secs.find(x=>x.id==='ev');if(ev){const b=ev.rows.filter(r=>!r.sub&&r.cells[3]>=10&&r.cells[6]+r.cells[5]>0).sort((x,y)=>y.cells[6]/y.cells[3]-x.cells[6]/x.cells[3])[0];if(b)out.push(t('msgBest')(b.cells[1],b.cells[10],b.cells[3]))}
  const cv=D.secs.find(x=>x.id==='cover');if(cv)cv.rows.filter(r=>r.seg==='r500'||r.seg==='rstrat').forEach(r=>out.push(t('msgCover')(r.cells[0],r.cells[3],r.cells[1],r.cells[4])));
  const co=D.secs.find(x=>x.id==='co');if(co&&co.rows[0]&&co.rows[0].cells[3])out.push(t('msgCo')(co.rows[0].cells[0],co.rows[0].cells[3]));

/* ---------- export Excel (un onglet par tableau) ---------- */
const CRC_T2=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32b(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T2[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(entries,mime){
  const te=new TextEncoder(),parts=[],cd=[];let off=0;
  entries.forEach(e=>{const data=te.encode(e.data),nm=te.encode(e.name),crc=crc32b(data),lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+data.length});
  const cds=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cds,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:mime});
}
function xlsxBook(sheets){

  for(let i=0;i<L2.length;i++)for(let j=i+1;j<L2.length;j++){const a=sg[i],b=sg[j];if(!a||!b)continue;
    const same=a===b||(Math.min(a.length,b.length)>=5&&lev(a,b)<=(Math.max(a.length,b.length)>=10?2:1));
    if(same&&!ENTIGN.includes([L2[i].name,L2[j].name].sort().join('||')))u(i,j)}

  return{all:L2.sort((a,b)=>cmp(a.name,b.name)),groups:Object.values(G).filter(g=>g.length>1).map(g=>g.sort((a,b)=>b.n-a.n||(b.name.match(/[A-ZÀ-Ý]/g)||[]).length-(a.name.match(/[A-ZÀ-Ý]/g)||[]).length))};
}
function entMerge(names,target){

}

      <div class="en-act"><label>${t('enKeep')} <select data-en-keep>${g.map(o=>`<option value="${esc(o.name)}">${esc(o.name)}</option>`).join('')}<option value="__other">${t('enOther')}</option></select></label>
      <button class="btn-o sm" data-x="en-ign">${t('enDiff')}</button><button class="btn sm" data-x="en-merge">${t('enMerge')}</button></div></div>`}).join('')}</div>`;
  const al=all.filter(o=>ok(o.name+' '+Object.keys(o.vars).join(' ')));
  if(al.length)h+=`<details class="cq-sec en-all"${tk.length?' open':''}><summary class="cq-h"><b>${t('enAllH')(al.length)}</b></summary><p class="muted" style="font-size:13px;margin:0 0 8px">${t('enAllHint')}</p>
    ${al.map(o=>`<div class="cq-row"><div class="cq-main"><b>${esc(o.name)}</b><span>${[t('enUses')(o.n),t('enCmos')(cm(o.name)),Object.keys(o.vars).length>1?Object.keys(o.vars).filter(v=>v!==o.name).join(', '):''].filter(Boolean).map(esc).join(' · ')}</span></div>
      <select class="en-into" data-en-into="${esc(o.name)}"><option value="">${t('enInto')}</option>${all.filter(x=>x!==o).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select></div>`).join('')}</details>`;
  const done=Object.entries(ENTFIX).filter(([k,v])=>ok(k+' '+v));
  if(done.length)h+=`<details class="cq-sec"><summary class="cq-h"><b>${t('enMapH')(done.length)}</b></summary>${done.map(([k,v])=>`<div class="cq-row"><div class="cq-main"><s>${esc(Object.keys(ENT_RAW).find(x=>entKey(x)===k)||k)}</s> → <b>${esc(v)}</b></div><button class="btn-o sm" data-x="en-undo" data-k="${esc(k)}">${t('enUndo')}</button></div>`).join('')}</details>`;
  return{n:gs.length,html:h};
}
XACT['en-merge']=b=>{const box=b.closest('[data-eg]'),names=JSON.parse(box.dataset.eg);let tg=box.querySelector('[data-en-keep]').value;
  if(tg==='__other'){tg=prompt(t('enNameQ'),names[0]);if(!tg)return}entMerge(names,tg)};
XACT['en-ign']=b=>{const names=JSON.parse(b.closest('[data-eg]').dataset.eg);for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const k=[names[i],names[j]].sort().join('||');if(!ENTIGN.includes(k))ENTIGN.push(k)}saveVault();rebuild();toast(t('enIgn'))};
XACT['en-undo']=b=>{delete ENTFIX[b.dataset.k];saveVault();rebuild();toast(t('enUndone'))};
grid.addEventListener('change',e=>{const s=e.target.closest&&e.target.closest('[data-en-into]');if(!s||!s.value)return;entMerge([s.dataset.enInto,s.value],s.value)});

/* intégration au contrôle « CMO et entités » */
const _cqItems=cmoQualItems;
cmoQualItems=function(){const r=_cqItems();const g=entGroups().groups.length;return{...r,ents:g,n:r.n+g}};
const _cqHTML=cmoQualHTML;
cmoQualHTML=function(tk){const e=entQualHTML(tk),c=_cqHTML(tk);const empty=!c.n&&c.html.includes('class="empty"');
  return{n:c.n+e.n,html:(e.html||'')+(empty&&e.html?'':c.html)}};

/* =========================================================
   VERROUILLAGE PAR MOT DE PASSE
   ========================================================= */
function showLock(){
  const setup=!HAS_VAULT;
  if(!ADMIN)$('lockBy').textContent='Conçu par Arnaud Tolon · '+L.fr.edStd.toLowerCase();
  document.documentElement.lang=lang;
  $('lockTitle').textContent=setup?t('lockSetupTitle'):t('lockTitle');
  $('lockSub').textContent=setup?t('lockSetupSub'):t('lockSub');
  $('pw1').placeholder=setup?t('pwNew'):t('pw');
  $('pw1').autocomplete=setup?'new-password':'current-password';
  $('pw2').placeholder=t('pwConfirm'); $('pw2').hidden=!setup;
  $('lockBtn').textContent=setup?t('create'):t('unlockBtn');
  $('lockReset').textContent=t('forgot'); $('lockReset').hidden=setup;
  $('lockErr').textContent='';
  try{if(sessionStorage.getItem('marcom-idle')){sessionStorage.removeItem('marcom-idle');if(!setup)$('lockSub').textContent=t('idleLocked')}}catch(_){}
  if(!(window.crypto&&crypto.subtle)){$('lockErr').textContent=t('noCrypto');$('lockBtn').disabled=true}
  $('lock').hidden=false; $('pw1').focus();
}
$('lockForm').onsubmit=async e=>{
  e.preventDefault();
  const pw=$('pw1').value, setup=!HAS_VAULT, err=$('lockErr'), btn=$('lockBtn');
  err.textContent='';
  if(setup){
    if(pw.length<8){err.textContent=t('tooShort');return}
    if(pw!==$('pw2').value){err.textContent=t('mismatch');return}
  }
  const lbl=btn.textContent; btn.disabled=true; btn.textContent=t('working');
  try{
    if(setup){
      SALT=crypto.getRandomValues(new Uint8Array(16));
      CRYPTO_KEY=await deriveKey(pw,SALT);
      applyState({rows:getJSON('crm-data-v1',null),meta:getJSON('crm-data-meta',null),merges:getJSON('crm-merges-v1',null),
                  ignored:getJSON('crm-ignored-v1',null),notes:getJSON('crm-notes-v2',null)});
      await saveVault(); HAS_VAULT=true; await prepareBuilder(pw);
      OLD_KEYS.forEach(removeLS);
    }else{
      const v=await KV.get('vault');
      SALT=fromB64(v.salt);
      const key=await deriveKey(pw,SALT);
      let plain;
      try{plain=await dec(v,key)}
      catch(_){err.textContent=t('wrongPw');$('pw1').select();return}
      CRYPTO_KEY=key; await prepareBuilder(pw);
      const st=JSON.parse(new TextDecoder().decode(plain));
      if(st.notes)for(const k of Object.keys(st.notes)){if(k.startsWith('ev:')&&k.includes('|')){const nk='ev:'+normName(k.slice(3).split('|')[0]);st.notes[nk]=(st.notes[nk]||[]).concat(st.notes[k]);delete st.notes[k]}}
      applyState(st);
      await loadPhotos();
    }
    $('pw1').value=$('pw2').value='';
    $('lock').hidden=true;
    buildModel(); refreshAll(); syncDiff(); if(view!=='import')input.focus();
    shAfterUnlock();
    if(needsBackupDot()&&(!LAST_BACKUP||Date.now()-new Date(LAST_BACKUP)>7*864e5))setTimeout(()=>toast(t('backupRemind')),900);
  }catch(ex){err.textContent=t('noCrypto')}
  finally{btn.disabled=false;btn.textContent=lbl}
};
$('lockReset').onclick=async()=>{
  if(!confirm(t('resetConfirm')))return;
  try{for(const k of await KV.keys())await KV.del(k)}catch(e){}
  try{await bClear(BDB)}catch(e){}
  OLD_KEYS.forEach(removeLS); location.reload();
};
$('btnLock').onclick=()=>lockApp(false);

(async()=>{
  await KV.init();
  try{
    HAS_VAULT=!!(await KV.get('vault'));
    if(!HAS_VAULT){const old=getJSON('crm-vault-v1',null);if(old){await KV.set('vault',old);removeLS('crm-vault-v1');HAS_VAULT=true}}
  }catch(e){}
  showLock();
})();
</script>
